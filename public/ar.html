<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciando Realidad Aumentada · Aves de La Guajira XR</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦜</text></svg>" />
  <style>
    :root {
      --bg: #091309;
      --accent: #d4a843;
      --glow: #00d2ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: #fff;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .launcher-card {
      max-width: 420px;
      width: 100%;
      background: #112014;
      border: 1px solid #2b442b;
      border-radius: 20px;
      padding: 32px 24px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }
    .spinner {
      width: 52px;
      height: 52px;
      border: 4px solid #2b442b;
      border-top-color: var(--glow);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 {
      font-size: 1.35rem;
      font-weight: 800;
      color: #fff;
    }
    p {
      font-size: 0.92rem;
      color: #a4baa4;
      line-height: 1.45;
    }
    .btn-manual {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px 20px;
      border-radius: 12px;
      background: linear-gradient(135deg, #2e7d32, #1b5e20);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      box-shadow: 0 4px 15px rgba(46,125,50,0.4);
      margin-top: 8px;
      border: none;
      cursor: pointer;
    }
    .btn-secondary {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="launcher-card">
    <div class="spinner" id="spinner"></div>
    <h1 id="bird-title">Iniciando Realidad Aumentada...</h1>
    <p id="status-msg">Abriendo la cámara de tu celular para proyectar el ave con sus etiquetas en 3D.</p>

    <button id="btn-launch-ar" class="btn-manual" style="display: none;">
      📷 Abrir Cámara en AR
    </button>

    <a id="btn-gallery" href="index.html" class="btn-secondary">
      Volver al visor web 3D
    </a>
  </div>

  <script>
    const BIRDS_METADATA = {
      buco: {
        name: 'Buco Gargantirrufo',
        annotatedGlb: 'models/annotated/buco_con_infografia.glb',
        usdz: 'models/buco.usdz'
      },
      flamenco: {
        name: 'Flamenco Americano',
        annotatedGlb: 'models/annotated/flamenco_con_infografia.glb',
        usdz: 'models/flamenco.usdz'
      },
      paloma: {
        name: 'Palomita Escamosa',
        annotatedGlb: 'models/annotated/paloma_con_infografia.glb',
        usdz: 'models/paloma.usdz'
      },
      rey_guajiro: {
        name: 'Rey Guajiro',
        annotatedGlb: 'models/annotated/rey_guajiro_con_infografia.glb',
        usdz: 'models/rey_guajiro.usdz'
      },
      turpial: {
        name: 'Turpial de La Guajira',
        annotatedGlb: 'models/annotated/turpial_con_infografia.glb',
        usdz: 'models/turpial.usdz'
      }
    };

    const urlParams = new URLSearchParams(window.location.search);
    const birdKey = (urlParams.get('bird') || urlParams.get('ave') || 'turpial').toLowerCase();
    const bird = BIRDS_METADATA[birdKey] || BIRDS_METADATA['turpial'];

    document.getElementById('bird-title').textContent = bird.name;
    document.getElementById('btn-gallery').href = `index.html?bird=${birdKey}`;

    const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
    const origin = isLocal ? 'https://aves-guajira-xr.vercel.app' : window.location.origin;
    const modelFullUrl = `${origin}/${bird.annotatedGlb}`;
    const fallbackWebUrl = `${origin}/?bird=${birdKey}`;

    const isAndroid = /android/i.test(navigator.userAgent);
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

    function triggerSceneViewer() {
      // Direct Scene Viewer intent on Android - launches camera AR instantly!
      const sceneViewerIntent = `intent://arvr.google.com/scene-viewer/1.0?file=${encodeURIComponent(modelFullUrl)}&mode=ar_only&title=${encodeURIComponent(bird.name)}#Intent;scheme=https;package=com.google.ar.core;action=android.intent.action.VIEW;S.browser_fallback_url=${encodeURIComponent(fallbackWebUrl)};end;`;
      window.location.href = sceneViewerIntent;
    }

    function triggerQuickLook() {
      const usdzUrl = `${origin}/${bird.usdz}`;
      const anchor = document.createElement('a');
      anchor.setAttribute('rel', 'ar');
      anchor.appendChild(document.createElement('img'));
      anchor.setAttribute('href', usdzUrl);
      document.body.appendChild(anchor);
      anchor.click();
    }

    const launchBtn = document.getElementById('btn-launch-ar');
    const statusMsg = document.getElementById('status-msg');

    if (isAndroid) {
      statusMsg.textContent = 'Lanzando Google Scene Viewer AR... Si no abre automáticamente, presiona el botón abajo.';
      launchBtn.style.display = 'inline-flex';
      launchBtn.addEventListener('click', triggerSceneViewer);
      // Auto launch
      setTimeout(triggerSceneViewer, 300);
    } else if (isIOS) {
      statusMsg.textContent = 'Dispositivo iOS detectado. Presiona el botón para abrir en Realidad Aumentada Quick Look.';
      launchBtn.style.display = 'inline-flex';
      launchBtn.textContent = '👁️ Abrir en Realidad Aumentada (iOS)';
      launchBtn.addEventListener('click', triggerQuickLook);
      setTimeout(triggerQuickLook, 400);
    } else {
      // Desktop / PC - redirect to 3D interactive gallery
      statusMsg.textContent = 'Para Realidad Aumentada se requiere un teléfono móvil. Redirigiendo a la galería 3D...';
      setTimeout(() => {
        window.location.href = fallbackWebUrl;
      }, 1000);
    }
  </script>
</body>
</html>
